<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폰트 전체 목록</title>
<style>/*@FONTFACES@*/</style>
<style>
:root {
  --bg: #F5F5F3;
  --panel: #FFFFFF;
  --border: #E2E2DE;
  --ink: #111111;
  --mid: #6B6B6B;
  --faint: #ABABAB;
  --badge-ofl: #D4EDDA;
  --badge-ofl-text: #1A5C2A;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111111; --panel: #1C1C1C; --border: #2E2E2E;
    --ink: #EFEFEF; --mid: #999; --faint: #444;
    --badge-ofl: #1A3A22; --badge-ofl-text: #6FCF97;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 14px; }
.header { padding: 36px 28px 0; max-width: 1400px; margin: 0 auto; }
h1 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 4px; }
.meta { color: var(--mid); font-size: 13px; margin-bottom: 16px; }
#search {
  width: 100%; max-width: 360px; display: block;
  padding: 9px 14px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 14px;
  background: var(--panel); color: var(--ink); outline: none;
  margin-bottom: 12px;
}
#search:focus { border-color: var(--ink); }
.filter-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 24px; }
.filter-btn {
  padding: 5px 11px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--panel); color: var(--mid); font-size: 12px; cursor: pointer;
  white-space: nowrap; transition: all .12s;
}
.filter-btn:hover { border-color: var(--ink); color: var(--ink); }
.filter-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px;
  padding: 0 28px 80px;
  max-width: 1400px;
  margin: 0 auto;
}
.card {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 16px 14px;
  display: flex; flex-direction: column; gap: 9px;
  transition: border-color .12s;
}
.card:hover { border-color: var(--faint); }
.card.hidden { display: none; }
.sample {
  font-size: 30px; line-height: 1.25; letter-spacing: -.01em;
  color: var(--ink); min-height: 40px; word-break: keep-all;
}
.card-info { display: flex; flex-direction: column; gap: 3px; }
.font-name { font-size: 12px; font-weight: 600; color: var(--ink); }
.font-sub { font-size: 11px; color: var(--mid); }
.badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.badge {
  font-size: 10px; font-weight: 500; padding: 2px 6px;
  border-radius: 4px;
}
.badge-ofl { background: var(--badge-ofl); color: var(--badge-ofl-text); }
.badge-tag { background: #F0F0EE; color: #555; }
@media (prefers-color-scheme: dark) { .badge-tag { background: #2A2A2A; color: #999; } }
.no-results { padding: 60px 28px; text-align: center; color: var(--mid); display: none; }
</style>
</head>
<body>
<div class="header">
  <h1>폰트 전체 목록</h1>
  <p class="meta">총 <strong id="cnt-total">0</strong>종 · 필터: <span id="cnt-visible">0</span>종 표시</p>
  <input id="search" type="search" placeholder="폰트 이름 검색…" autocomplete="off">
  <div class="filter-group">
    <button class="filter-btn active" data-filter="all">전체</button>
<!--@TAG_BUTTONS@-->
    <button class="filter-btn" data-filter="ofl">OFL만</button>
  </div>
</div>
<div class="grid" id="grid">
<!--@CARDS@-->
</div>
<div class="no-results" id="no-results">검색 결과 없음</div>
<script>
const cards = Array.from(document.querySelectorAll('.card'));
const search = document.getElementById('search');
const noResults = document.getElementById('no-results');
const cntVisible = document.getElementById('cnt-visible');
let currentFilter = 'all';

document.getElementById('cnt-total').textContent = cards.length;
cntVisible.textContent = cards.length;

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilter();
  });
});

search.addEventListener('input', applyFilter);

function applyFilter() {
  const q = search.value.toLowerCase().trim();
  let visible = 0;
  cards.forEach(card => {
    let matchFilter;
    if (currentFilter === 'all') matchFilter = true;
    else if (currentFilter === 'ofl') matchFilter = !!card.querySelector('.badge-ofl');
    else matchFilter = (card.dataset.tags || '').split(' ').includes(currentFilter);
    const matchSearch = !q || card.dataset.name.toLowerCase().includes(q) || card.dataset.folder.toLowerCase().includes(q);
    const show = matchFilter && matchSearch;
    card.classList.toggle('hidden', !show);
    if (show) visible++;
  });
  cntVisible.textContent = visible;
  noResults.style.display = visible === 0 ? 'block' : 'none';
}
</script>
</body>
</html>
