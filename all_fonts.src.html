<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폰트 전체 목록</title>
<style>/*@FONTFACES@*/</style>
<style>
:root {
  --bg: #F5F5F3;
  --panel: #FFFFFF;
  --border: #E2E2DE;
  --ink: #111111;
  --mid: #6B6B6B;
  --faint: #ABABAB;
  --accent: #1A1A1A;
  --badge-ofl: #D4EDDA;
  --badge-ofl-text: #1A5C2A;
  --badge-local: #F0F0F0;
  --badge-local-text: #888888;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111111; --panel: #1C1C1C; --border: #2E2E2E;
    --ink: #EFEFEF; --mid: #999; --faint: #555;
    --badge-ofl: #1A3A22; --badge-ofl-text: #6FCF97;
    --badge-local: #2A2A2A; --badge-local-text: #666;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; font-size: 14px; }
.header { padding: 40px 28px 28px; max-width: 1400px; margin: 0 auto; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 6px; }
.meta { color: var(--mid); font-size: 13px; }
.search-wrap { margin-top: 20px; }
#search {
  width: 100%; max-width: 400px;
  padding: 9px 14px; border: 1px solid var(--border);
  border-radius: 8px; font-size: 14px;
  background: var(--panel); color: var(--ink);
  outline: none;
}
#search:focus { border-color: var(--ink); }
.filters { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.filter-btn {
  padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--panel); color: var(--mid); font-size: 12px; cursor: pointer;
}
.filter-btn.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 12px;
  padding: 0 28px 80px;
  max-width: 1400px;
  margin: 0 auto;
}
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 18px 16px;
  display: flex; flex-direction: column; gap: 10px;
  transition: border-color .15s;
}
.card:hover { border-color: var(--faint); }
.card.hidden { display: none; }
.sample {
  font-size: 32px;
  line-height: 1.25;
  letter-spacing: -.01em;
  color: var(--ink);
  min-height: 44px;
  word-break: keep-all;
}
.card-info { display: flex; flex-direction: column; gap: 4px; }
.font-name { font-size: 12px; font-weight: 600; color: var(--ink); }
.font-sub { font-size: 11px; color: var(--mid); }
.badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
.badge {
  font-size: 10px; font-weight: 600; padding: 2px 6px;
  border-radius: 4px; letter-spacing: .03em;
}
.badge-ofl { background: var(--badge-ofl); color: var(--badge-ofl-text); }
.badge-local { background: var(--badge-local); color: var(--badge-local-text); }
.no-results { padding: 60px 28px; text-align: center; color: var(--mid); display: none; }
</style>
</head>
<body>
<div class="header">
  <h1>폰트 전체 목록</h1>
  <p class="meta">총 <strong id="cnt-total">0</strong>종</p>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="폰트 이름 검색…" autocomplete="off">
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">전체</button>
    <button class="filter-btn" data-filter="ofl">OFL만</button>
  </div>
</div>
<div class="grid" id="grid">
<!--@CARDS@-->
</div>
<div class="no-results" id="no-results">검색 결과 없음</div>
<script>
const cards = document.querySelectorAll('.card');
const search = document.getElementById('search');
const noResults = document.getElementById('no-results');
let currentFilter = 'all';

document.getElementById('cnt-total').textContent = cards.length;

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    applyFilter();
  });
});

search.addEventListener('input', applyFilter);

function applyFilter() {
  const q = search.value.toLowerCase().trim();
  let visible = 0;
  cards.forEach(card => {
    const matchFilter = currentFilter === 'all' || (currentFilter === 'ofl' && card.querySelector('.badge-ofl'));
    const matchSearch = !q || card.dataset.name.toLowerCase().includes(q) || card.dataset.folder.toLowerCase().includes(q);
    card.classList.toggle('hidden', !(matchFilter && matchSearch));
    if (matchFilter && matchSearch) visible++;
  });
  noResults.style.display = visible === 0 ? 'block' : 'none';
}
</script>
</body>
</html>
